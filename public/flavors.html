<script>
(function () {
  var stored = localStorage.getItem('omg-theme') || 'light';
  if (stored === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('themeToggle');
    var knob = document.getElementById('toggleKnob');
    if (!btn) return;
    if (knob) knob.textContent = stored === 'dark' ? '☀️' : '🌙';

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        if (knob) knob.textContent = '🌙';
        localStorage.setItem('omg-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (knob) knob.textContent = '☀️';
        localStorage.setItem('omg-theme', 'dark');
      }
    });
  });
})();
</script>

<style>
:root {
  --bg-body: #f5f2ef;
  --bg-card: #ffffff;
  --bg-card-hover: #faf8f6;
  --bg-sold: #f1eeea;
  --text-primary: #2c241e;
  --text-secondary: #8f8076;
  --text-muted: #b3a69c;
  --text-sync: #5a7a5a;
  --border-light: #e5ddd6;
  --border-hover: #d0c4ba;
  --border-sold: #ddd5ce;
  --shadow-card: 0 2px 12px rgba(44, 36, 30, 0.06);
  --shadow-hover: 0 4px 16px rgba(44, 36, 30, 0.08);
  --shadow-item: 0 1px 4px rgba(44, 36, 30, 0.04);
  --accent: #b09888;
  --accent-light: #d5c8be;
  --scroll-track: #e5ddd6;
  --scroll-fill: linear-gradient(90deg, #d5c8be, #e8ddd2);
  --sold-tag-bg: rgba(255, 255, 255, 0.75);
  --sold-tag-border: #ddd5ce;
  --control-bg: #ffffff;
  --control-border: #e5ddd6;
  --control-divider: #e5ddd6;

}
[data-theme="dark"] {
  --bg-body: #1e1b18;
  --bg-card: #2b2724;
  --bg-card-hover: #35302c;
  --bg-sold: #25211e;
  --text-primary: #ede7e0;
  --text-secondary: #b8ada4;
  --text-muted: #9a8e84;
  --text-sync: #8fad8a;
  --border-light: #3d3530;
  --border-hover: #5a4f48;
  --border-sold: #3d3530;
  --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.3);
  --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.4);
  --shadow-item: 0 1px 4px rgba(0, 0, 0, 0.25);
  --accent: #c4b0a4;
  --accent-light: #e0d2c8;
  --scroll-track: #3d3530;
  --scroll-fill: linear-gradient(90deg, #a08878, #c4b0a4);
  --sold-tag-bg: rgba(43, 39, 36, 0.85);
  --sold-tag-border: #3d3530;
  --control-bg: #2b2724;
  --control-border: #3d3530;
  --control-divider: #3d3530;
  --footer-color: #5a4f48;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-body);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  /* 底部預留給訂購按鈕 */
  padding: 14px 16px calc(110px + env(safe-area-inset-bottom));
  color: var(--text-primary);
  transition: background 0.35s ease, color 0.35s ease;
}

.container { max-width: 500px; width: 100%; }

/* ===== 頂部工具列 ===== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--control-bg);
  border: 1px solid var(--control-border);
  border-radius: 40px;
  padding: 4px 6px;
  box-shadow: var(--shadow-item);
  position: sticky;
  top: 10px;
  z-index: 999;
  transition: background 0.35s ease, border-color 0.35s ease;
}

.pill-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  border-radius: 30px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.pill-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.pill-btn:active { transform: scale(0.95); }

.sync-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-sync);
  white-space: nowrap;
}
.sync-badge .indicator {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #a0b8a8;
  flex-shrink: 0;
  transition: background 0.4s ease;
}
.sync-badge .indicator.online {
  background: #34a853;
  box-shadow: 0 0 8px rgba(52, 168, 83, 0.35);
  animation: pulse-dot 1.8s ease-in-out infinite;
}
.sync-badge .indicator.connecting {
  background: #fbbc04;
  animation: pulse-dot 1s ease-in-out infinite;
}
.sync-badge .indicator.offline { background: #ea4335; }

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* ===== 品牌 ===== */
.brand { text-align: center; padding: 16px 0 6px; }
.brand-logo {
  width: 72px; height: 72px;
  object-fit: contain;
  filter: drop-shadow(0 4px 16px rgba(44, 36, 30, 0.08));
}
.brand-title-box { display: inline-flex; flex-direction: column; align-items: center; }
.brand-title {
  font-size: 30px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 2px;
  line-height: 1.1;
  margin-top: 4px;
}
.brand-title span { color: var(--accent); }
.brand-divider {
  width: 100%; height: 3px;
  background: linear-gradient(90deg, #009246 33.33%, #ffffff 33.33%, #ffffff 66.66%, #ce2b37 66.66%);
  margin: 6px auto 0;
  border-radius: 4px;
  box-shadow: 0 0 12px rgba(206, 43, 55, 0.15), 0 0 12px rgba(0, 146, 70, 0.15);
}

/* ===== 頁面標題 ===== */
.page-title {
  text-align: center;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 18px 0 4px;
  letter-spacing: 0.5px;
}
.page-sub {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.5;
}
.page-sub .arrow { color: var(--accent); font-weight: 700; }

/* ===== 口味區塊 ===== */
.today-section {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 16px 14px 14px;
  box-shadow: var(--shadow-card);
  border: 1px solid var(--border-light);
  transition: background 0.35s ease, border-color 0.35s ease;
}
.today-scroll-wrapper { position: relative; overflow: hidden; }
.today-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 0 8px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  cursor: grab;
}
.today-scroll:active { cursor: grabbing; }
.today-scroll::-webkit-scrollbar { height: 0; }
.today-scroll-content { display: flex; gap: 10px; width: max-content; }
.today-grid {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(2, 1fr);
  gap: 10px;
  width: max-content;
}
.today-card {
  width: 122px;
  background: var(--bg-card);
  border-radius: 16px;
  padding: 14px 10px 12px;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-item);
  text-align: center;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: all 0.2s ease;
}
.today-card:hover:not(.sold-out) {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}
.today-card.sold-out {
  background: var(--bg-sold);
  border-color: var(--border-sold);
  opacity: 0.6;
}
.today-card.sold-out .today-name {
  color: var(--text-muted);
  text-decoration: line-through;
}
.today-card .sold-tag {
  position: absolute;
  top: 6px; right: 6px;
  font-size: 8px;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--sold-tag-bg);
  padding: 1px 8px;
  border-radius: 30px;
  border: 1px solid var(--sold-tag-border);
  z-index: 2;
}
.today-card:not(.sold-out) .sold-tag { display: none; }
.today-card .color-tag {
  width: 24px; height: 4px;
  border-radius: 10px;
  margin-bottom: 8px;
  flex-shrink: 0;
}
.today-card .today-name {
  font-weight: 600;
  font-size: 15px;
  color: var(--text-primary);
  line-height: 1.3;
  word-break: break-word;
}
.today-card .today-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}
.today-empty {
  font-size: 13px;
  color: var(--text-muted);
  padding: 26px 0;
  text-align: center;
  width: 280px;
}

/* 滑動提示手指 */
.finger-swipe {
  position: absolute;
  bottom: 12px; left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  font-size: 24px;
  color: var(--accent);
  opacity: 0.8;
  pointer-events: none;
  animation: fingerMove 1.8s ease-in-out 2;
  transition: opacity 0.6s ease;
}
@keyframes fingerMove {
  0%, 100% { transform: translateX(-50%) translateX(-15px); opacity: 0.4; }
  50% { transform: translateX(-50%) translateX(15px); opacity: 1; }
}
.finger-swipe.hidden { opacity: 0 !important; animation: none !important; }

/* 滾動進度條 */
.scroll-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 6px;
}
.scroll-indicator .track {
  flex: 1;
  height: 3px;
  background: var(--scroll-track);
  border-radius: 10px;
  overflow: hidden;
}
.scroll-indicator .track .fill {
  height: 100%;
  width: 20%;
  background: var(--scroll-fill);
  border-radius: 10px;
  transition: width 0.3s ease;
}

/* ===== 底部固定訂購按鈕（新增） ===== */
.order-cta-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg-body) 70%, transparent);
  z-index: 900;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.order-cta-btn {
  pointer-events: auto;
  width: 100%;
  max-width: 460px;
  padding: 15px 24px;
  border: none;
  border-radius: 50px;
  background: #06C755;
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(6, 199, 85, 0.35);
  transition: transform 0.15s ease, box-shadow 0.2s ease;
}
.order-cta-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(6, 199, 85, 0.45);
}
.order-cta-btn:active { transform: scale(0.97); }

/* 底部 */
.update-time {
  text-align: right;
  font-size: 11px;
  color: var(--text-muted);
  margin: 10px 2px 0;
}
.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 11px;
  color: var(--footer-color);
  border-top: 1px solid var(--border-light);
  padding-top: 14px;
  line-height: 1.6;
}

/* 全螢幕公告 */
#globalOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  padding: 24px;
}
#globalOverlay .overlay-card {
  background: #fff;
  border-radius: 32px;
  padding: 40px 32px;
  max-width: 480px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}
#globalOverlay .overlay-emoji { font-size: 64px; margin-bottom: 8px; }
#globalOverlay .overlay-title { font-size: 18px; font-weight: 600; color: #2d1b12; margin-bottom: 4px; }
#globalOverlay .overlay-content { font-size: 16px; color: #6b5b4e; line-height: 1.8; white-space: pre-line; }
#globalOverlay .overlay-sub {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #f0ebe6;
  font-size: 13px;
  color: #b0a094;
}
#globalOverlay .overlay-close {
  margin-top: 16px;
  background: #f0ebe6;
  border: none;
  padding: 8px 24px;
  border-radius: 30px;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  color: #6b5b4e;
}

@media (max-width: 480px) {
  body { padding: 10px 12px calc(104px + env(safe-area-inset-bottom)); }
  .brand-logo { width: 62px; height: 62px; }
  .brand-title { font-size: 26px; letter-spacing: 1.5px; }
  .page-title { font-size: 15px; }
  .today-card { width: 108px; padding: 12px 8px 10px; min-height: 92px; }
  .today-card .today-name { font-size: 14px; }
  .pill-btn, .sync-badge { font-size: 11px; padding: 6px 10px; }
}
</style>
</head>

<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, onValue } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyDvzZKr2x3TGeOFZGisKKXjbYH00DLVhKg",
  authDomain: "omg-menu-5761a.firebaseapp.com",
  databaseURL: "https://omg-menu-5761a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "omg-menu-5761a",
  storageBucket: "omg-menu-5761a.firebasestorage.app",
  messagingSenderId: "193209930119",
  appId: "1:193209930119:web:d9216165be9ef6c0bcc322"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const todayGrid       = document.getElementById('todayGrid');
const todayScroll     = document.getElementById('todayScroll');
const scrollFill      = document.getElementById('scrollFill');
const syncText        = document.getElementById('syncText');
const indicatorDot    = document.getElementById('indicatorDot');
const updateTimeDisplay = document.getElementById('updateTimeDisplay');
const fingerSwipe     = document.getElementById('fingerSwipe');
const backBtn         = document.getElementById('backBtn');

const COLOR_MAP = {
  '開心果': '#8CB872', '草莓': '#E8837A', '巧克力': '#8D7A6D', '芒果': '#F5C542',
  '抹茶': '#89B87C', '香草': '#F5E6D3', '咖啡': '#B5957A', '檸檬': '#F5E56B',
  '覆盆子': '#E8707A', '椰奶': '#F5F0EA', '百香果': '#F5B84D', '牛奶': '#FDF8F0',
  'Oreo': '#6B5A4D', '香蕉': '#F5D87A', '藍莓': '#7A8FC9', '水蜜桃': '#F5D0C0',
  '提拉米蘇': '#C4B0A0', '紅茶': '#C4B0A0', '伯爵奶茶': '#E0D5CC', '榴槤': '#F5C542',
  '芋頭牛奶': '#C9A8D0', '綜合堅果': '#C4B0A0', '芒果優格': '#F5C542', '烏龍茶': '#A09080',
  '70%巧克力': '#6B5A4D', '巧克力70%': '#6B5A4D', '白咖啡': '#D5C8BF', '蜜香紅茶': '#D5C0A8',
  '黑金芝麻': '#4A3A30', '紅豆牛奶': '#D5A0A0', '法芙娜': '#6B5A4D', '波本香草': '#F5E6D3',
  '迎香紅茶': '#D5C0A8', '青心烏龍茶': '#A09080', '藍莓優格': '#7A8FC9', '百香果優格': '#F5B84D',
  '榴蓮': '#F5C542', '奇異果': '#89B87C', '草莓優格': '#E8837A', '火龍果': '#E8707A',
  '奶茶': '#D5C8BF', '熱帶水果': '#F5C542', '酪梨': '#A8C48C'
};

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function getCurrentTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function setSyncStatus(status, text) {
  indicatorDot.className = 'indicator ' + status;
  syncText.textContent = text;
  updateTimeDisplay.textContent = '口味同步系統更新於 ' + getCurrentTime();
}

function hideFinger() {
  if (!fingerSwipe) return;
  fingerSwipe.classList.add('hidden');
  setTimeout(() => { fingerSwipe.style.display = 'none'; }, 600);
}
function checkScrollable() {
  if (!todayScroll || !fingerSwipe) return;
  const scrollable = todayScroll.scrollWidth > todayScroll.clientWidth + 8;
  if (scrollable) {
    fingerSwipe.style.display = 'block';
    fingerSwipe.classList.remove('hidden');
    clearTimeout(window.__fingerTimer);
    window.__fingerTimer = setTimeout(hideFinger, 3800);
  } else {
    hideFinger();
  }
}
todayScroll.addEventListener('scroll', hideFinger, { passive: true });

function updateScrollIndicator() {
  const el = todayScroll, fill = scrollFill;
  if (!el || !fill) return;
  const update = () => {
    const max = el.scrollWidth - el.clientWidth;
    if (max <= 0) { fill.style.width = '100%'; return; }
    fill.style.width = Math.min((el.scrollLeft / max) * 80 + 20, 100) + '%';
  };
  el.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  setTimeout(update, 300);
}

onValue(ref(db, 'todayFlavors'), (snapshot) => {
  const data = snapshot.val();
  const emptyHtml = '<div class="today-empty">今天還沒有特別推薦 🍽️</div>';

  if (!data) {
    todayGrid.innerHTML = emptyHtml;
    setSyncStatus('online', '同步中');
    setTimeout(checkScrollable, 300);
    return;
  }

  const items = Object.keys(data)
    .map(k => ({ id: k, ...data[k] }))
    .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

  if (!items.length) {
    todayGrid.innerHTML = emptyHtml;
    setSyncStatus('online', '同步中');
    setTimeout(checkScrollable, 300);
    return;
  }

  let html = '';
  items.forEach(item => {
    const sold = item.soldOut === true;
    const color = COLOR_MAP[item.name] || '#D5C8BF';
    html += `
      <div class="today-card ${sold ? 'sold-out' : ''}"
           data-flavor="${escapeHtml(item.name)}"
           data-sold="${sold}">
        ${sold ? '<span class="sold-tag">售完</span>' : ''}
        <div class="color-tag" style="background:${color};"></div>
        <div class="today-name">${escapeHtml(item.name)}</div>
        ${item.desc ? `<div class="today-desc">${escapeHtml(item.desc)}</div>` : ''}
      </div>`;
  });

  todayGrid.innerHTML = html;
  setSyncStatus('online', '同步中');
  setTimeout(() => { checkScrollable(); updateScrollIndicator(); }, 350);
}, () => {
  todayGrid.innerHTML = '<div class="today-empty">連線服務中斷⋯口味無法同步，請至門市直接洽詢</div>';
  setSyncStatus('offline', '離線');
});

onValue(ref(db, 'siteConfig'), (snap) => {
  const d = snap.val();
  if (!d || !d.brand) return;

  if (d.brand.mainTitle) {
    const el = document.getElementById('brandMainTitle');
    if (el) {
      const t = String(d.brand.mainTitle);
      const idx = t.indexOf(' ');
      if (idx > 0) {
        el.innerHTML = escapeHtml(t.slice(0, idx + 1)) + '<span>' + escapeHtml(t.slice(idx + 1)) + '</span>';
      } else {
        el.textContent = t;
      }
    }
  }
  if (d.brand.subTitle) {
    document.getElementById('todaySectionTitle').textContent = d.brand.subTitle;
  }
  if (d.brand.flavorSubTitle) {
    document.getElementById('todaySectionSub').innerHTML = escapeHtml(d.brand.flavorSubTitle);
  }
});

onValue(ref(db, 'globalOverlay'), (snap) => {
  const data = snap.val();
  const existing = document.getElementById('globalOverlay');

  if (data && data.isActive === true) {
    if (existing) return;
    const div = document.createElement('div');
    div.id = 'globalOverlay';
    div.innerHTML = `
      <div class="overlay-card">
        <div class="overlay-emoji">${data.title ? escapeHtml(String(data.title).split(' ')[0]) : '📢'}</div>
        <p class="overlay-title">${escapeHtml(data.title || '公告')}</p>
        <p class="overlay-content">${escapeHtml(data.content || '')}</p>
        <div class="overlay-sub">${escapeHtml(data.subText || '')}</div>
        ${data.isForce ? '' : '<button id="closeOverlayBtn" class="overlay-close">關閉</button>'}
      </div>`;
    document.body.appendChild(div);
    document.body.style.overflow = 'hidden';
    if (!data.isForce) {
      document.getElementById('closeOverlayBtn')?.addEventListener('click', () => {
        div.remove();
        document.body.style.overflow = '';
      });
    }
  } else if (existing) {
    existing.remove();
    document.body.style.overflow = '';
  }
});

backBtn.addEventListener('click', async () => {
  try {
    if (window.liff && typeof window.liff.isInClient === 'function' && window.liff.isInClient()) {
      window.liff.closeWindow();
      return;
    }
  } catch (e) { /* ignore */ }

  if (document.referrer && document.referrer !== '') {
    history.back();
  } else {
    window.location.href = '/';
  }
});

/* ---------- 前往訂購頁（改用 liff.openWindow） ---------- */
const ORDER_PAGE_URL = '/menu/';

document.getElementById('goOrderBtn').addEventListener('click', async () => {
  const url = new URL(ORDER_PAGE_URL, location.href).href;
  try {
    if (window.liff && typeof window.liff.openWindow === 'function') {
      window.liff.openWindow({ url: url, external: false });
      return;
    }
  } catch (e) { /* ignore */ }
  location.href = url;
});
</script>
