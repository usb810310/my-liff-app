<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMG!Gelato 今日口味</title>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js"
            }
        }
    </script>
    <script>
        (function() {
            const stored = localStorage.getItem('omg-theme') || 'light';
            if (stored === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            document.addEventListener('DOMContentLoaded', function() {
                const btn = document.getElementById('themeToggle');
                const knob = document.getElementById('toggleKnob');
                const label = document.getElementById('themeLabel');
                if (!btn) return;
                function setTheme(theme) {
                    const html = document.documentElement;
                    if (theme === 'dark') {
                        html.setAttribute('data-theme', 'dark');
                        if (knob) knob.textContent = '☀️';
                        if (label) label.textContent = '白主題';
                        localStorage.setItem('omg-theme', 'dark');
                    } else {
                        html.removeAttribute('data-theme');
                        if (knob) knob.textContent = '🌙';
                        if (label) label.textContent = '黑主題';
                        localStorage.setItem('omg-theme', 'light');
                    }
                }
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const current = document.documentElement.getAttribute('data-theme');
                    setTheme(current === 'dark' ? 'light' : 'dark');
                });
                const initTheme = document.documentElement.getAttribute('data-theme');
                if (label) label.textContent = initTheme === 'dark' ? '白主題' : '黑主題';
            });
        })();
    </script>
    <style>
        :root {
            --bg-body: #f5f2ef;
            --bg-card: #ffffff;
            --bg-card-hover: #faf8f6;
            --bg-sold: #f1eeea;
            --text-primary: #2c241e;
            --text-secondary: #8f8076;
            --text-muted: #b3a69c;
            --text-footer: #ccc2b8;
            --border-light: #e5ddd6;
            --border-hover: #d0c4ba;
            --border-sold: #ddd5ce;
            --shadow-card: 0 2px 12px rgba(44, 36, 30, 0.06);
            --shadow-hover: 0 4px 16px rgba(44, 36, 30, 0.08);
            --shadow-item: 0 1px 4px rgba(44, 36, 30, 0.04);
            --accent: #b09888;
            --accent-light: #d5c8be;
            --scroll-track: #e5ddd6;
            --scroll-fill: linear-gradient(90deg, #d5c8be, #e8ddd2);
            --sold-tag-bg: rgba(255, 255, 255, 0.75);
            --sold-tag-border: #ddd5ce;
            --control-bg: var(--bg-card);
            --control-border: var(--border-light);
            --control-divider: var(--border-light);
            --overlay-bg: rgba(0, 0, 0, 0.5);
        }
        [data-theme="dark"] {
            --bg-body: #1e1b18;
            --bg-card: #2b2724;
            --bg-card-hover: #35302c;
            --bg-sold: #25211e;
            --text-primary: #ede7e0;
            --text-secondary: #b8ada4;
            --text-muted: #9a8e84;
            --text-footer: #5a4f48;
            --border-light: #3d3530;
            --border-hover: #5a4f48;
            --border-sold: #3d3530;
            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-item: 0 1px 4px rgba(0, 0, 0, 0.25);
            --accent: #c4b0a4;
            --accent-light: #e0d2c8;
            --scroll-track: #3d3530;
            --scroll-fill: linear-gradient(90deg, #a08878, #c4b0a4);
            --sold-tag-bg: rgba(43, 39, 36, 0.85);
            --sold-tag-border: #3d3530;
            --control-bg: #2b2724;
            --control-border: #3d3530;
            --control-divider: #3d3530;
            --overlay-bg: rgba(0, 0, 0, 0.7);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        body {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px 110px;
            transition: background 0.35s ease;
            color: var(--text-primary);
        }
        .container {
            max-width: 500px;
            width: 100%;
        }

        /* ===== 品牌 ===== */
        .brand { text-align: center; padding: 10px 0 14px; }
        .brand-inner { display: flex; flex-direction: column; align-items: center; }
        .brand-logo-wrapper { display: flex; justify-content: center; margin-bottom: 4px; }
        .brand-logo {
            width: 80px; height: 80px; object-fit: contain;
            filter: drop-shadow(0 4px 16px rgba(44, 36, 30, 0.08));
            transition: transform 0.4s ease;
        }
        .brand-logo:hover { transform: scale(1.05) rotate(-2deg); }
        .brand-title {
            font-size: 34px; font-weight: 700; color: var(--text-primary);
            letter-spacing: 2px; line-height: 1.1;
        }
        .brand-title span { color: var(--accent); font-weight: 700; }
        .brand-title-box { display: inline-flex; flex-direction: column; align-items: center; }
        .brand-divider {
            width: 100%; height: 3px;
            background: linear-gradient(90deg, #009246 33.33%, #ffffff 33.33%, #ffffff 66.66%, #ce2b37 66.66%);
            margin: 4px auto 16px; border-radius: 4px;
            box-shadow: 0 0 12px rgba(206, 43, 55, 0.15), 0 0 12px rgba(0, 146, 70, 0.15);
        }

        /* ===== 控制欄 ===== */
        .control-bar {
            display: flex; align-items: center; justify-content: center;
            gap: 0; background: var(--control-bg); border-radius: 40px;
            border: 1px solid var(--control-border); box-shadow: var(--shadow-item);
            padding: 4px 6px; margin: 10px auto 16px; width: fit-content; max-width: 100%;
            transition: background 0.35s ease, border-color 0.35s ease;
            position: sticky; top: 10px; z-index: 999;
        }
        .control-item {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 16px; border-radius: 30px;
            font-size: 12px; font-weight: 500; color: var(--text-secondary);
            background: transparent; border: none; cursor: pointer;
            transition: all 0.2s ease; text-decoration: none; white-space: nowrap;
        }
        .control-item .icon { font-size: 14px; line-height: 1; }
        .control-item .label { font-size: 12px; font-weight: 500; letter-spacing: 0.3px; }
        .control-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .control-item:active { transform: scale(0.96); }
        .control-divider {
            width: 1px; height: 24px; background: var(--control-divider);
            flex-shrink: 0; opacity: 0.5;
        }
        .sync-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 16px; border-radius: 30px;
            font-size: 12px; font-weight: 500; color: var(--text-secondary);
            background: transparent; border: none; cursor: default; white-space: nowrap;
        }
        .sync-badge .indicator {
            width: 7px; height: 7px; border-radius: 50%;
            background: #a0b8a8; flex-shrink: 0; transition: background 0.4s ease;
        }
        .sync-badge .indicator.online {
            background: #34a853; box-shadow: 0 0 8px rgba(52, 168, 83, 0.35);
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        .sync-badge .indicator.connecting { background: #fbbc04; animation: pulse-dot 1s ease-in-out infinite; }
        .sync-badge .indicator.offline { background: #ea4335; }
        .sync-badge .sync-label { font-size: 12px; font-weight: 500; letter-spacing: 0.3px; }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .theme-toggle-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 16px; border-radius: 30px;
            font-size: 12px; font-weight: 500; color: var(--text-secondary);
            background: transparent; border: none; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .theme-toggle-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .theme-toggle-btn:active { transform: scale(0.96); }
        .theme-toggle-btn .icon { font-size: 14px; line-height: 1; }
        .theme-toggle-btn .label { font-size: 12px; font-weight: 500; letter-spacing: 0.3px; }

        /* ===== 品牌下方標題 ===== */
        .brand-sub-title {
            font-size: 13px; color: var(--text-secondary);
            text-align: center; margin-top: 2px; padding: 0 8px;
        }

        /* ===== 營業狀態條 ===== */
        .shop-status-bar {
            display: flex; align-items: center; gap: 8px;
            margin: 12px 0 4px; padding: 12px 16px;
            border-radius: 14px; font-size: 14px; font-weight: 700;
            background: #e7efe4; color: #3f6a3b;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .shop-status-bar .dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #4caf50; flex: none;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        .shop-status-bar small {
            display: block; font-weight: 500; opacity: .85;
            font-size: 12px; margin-top: 2px;
        }
        .shop-status-bar.closed { background: #fbeeea; color: #8a5a4f; }
        .shop-status-bar.closed .dot { background: #c9695b; box-shadow: none; animation: none; }
        .shop-status-bar.reservable { background: #fff6e5; color: #8a6a2f; }
        .shop-status-bar.reservable .dot { background: #e8a33d; box-shadow: none; animation: none; }

        /* ===== 今日口味區 ===== */
        .today-section {
            position: relative; margin-bottom: 16px; margin-top: 12px;
            background: var(--bg-card); border-radius: 20px;
            padding: 18px 14px 16px; box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }
        .today-section .section-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 12px; flex-wrap: wrap;
        }
        .scroll-indicator {
            display: flex; align-items: center; gap: 8px;
            font-size: 10px; color: var(--text-muted); width: 100%;
        }
        .scroll-indicator .hint-text {
            display: flex; align-items: center; gap: 4px; white-space: nowrap;
        }
        .scroll-indicator .track {
            flex: 1; height: 3px; background: var(--scroll-track);
            border-radius: 10px; overflow: hidden; max-width: 200px;
        }
        .scroll-indicator .track .fill {
            height: 100%; width: 25%; background: var(--scroll-fill);
            border-radius: 10px; transition: width 0.3s ease;
        }
        .today-scroll-wrapper { position: relative; overflow: hidden; margin-top: 2px; }
        .today-scroll {
            overflow-x: auto; overflow-y: hidden;
            padding: 4px 0 6px 0; -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth; cursor: grab;
        }
        .today-scroll:active { cursor: grabbing; }
        .today-scroll::-webkit-scrollbar { height: 0px; }
        .today-scroll-content { display: flex; gap: 10px; width: max-content; }
        .today-grid {
            display: grid; grid-auto-flow: column;
            grid-template-rows: repeat(2, 1fr);
            gap: 10px; width: max-content;
        }
        .today-card {
            width: 130px; background: var(--bg-card); border-radius: 16px;
            padding: 22px 10px 12px; border: 1px solid var(--border-light);
            box-shadow: var(--shadow-item); text-align: center;
            min-height: 110px; display: flex; flex-direction: column;
            align-items: center; position: relative;
            transition: all 0.2s ease;
        }
        .today-card:hover:not(.sold-out) {
            border-color: var(--border-hover); transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .today-card.sold-out {
            background: var(--bg-sold); border-color: var(--border-sold); opacity: 0.6;
        }
        .today-card.sold-out .today-name {
            color: var(--text-muted); text-decoration: line-through;
        }
        .today-card .badge {
            position: absolute; top: 6px; right: 6px;
            font-size: 9px; font-weight: 700;
            padding: 2px 8px; border-radius: 30px; z-index: 2;
            line-height: 14px; white-space: nowrap;
        }
        .badge-sold {
            color: var(--text-muted); background: var(--sold-tag-bg);
            border: 1px solid var(--sold-tag-border);
        }
        .badge-new {
            color: #fff;
            background: linear-gradient(135deg, #ff8a65, #ff5252);
            box-shadow: 0 1px 6px rgba(255, 82, 82, 0.45);
            animation: newPulse 1.8s ease-in-out infinite;
        }
        @keyframes newPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .badge-hot {
            color: #fff;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            box-shadow: 0 1px 6px rgba(255, 152, 0, 0.45);
        }
        .badge-sales {
            color: var(--text-secondary); background: var(--bg-sold);
            border: 1px solid var(--border-light);
        }
        .today-card .today-name {
            font-weight: 600; font-size: 15px; color: var(--text-primary);
        }
        .today-card .today-desc {
            font-size: 11px; color: var(--text-muted); margin-top: 2px;
        }
        .today-card .color-tag {
            width: 22px; height: 3px; border-radius: 10px;
            margin-bottom: 6px; flex-shrink: 0;
        }
        .today-empty {
            font-size: 13px; color: var(--text-muted);
            padding: 12px 0; text-align: center;
        }
        .today-grid .loading {
            font-size: 13px; color: var(--text-muted); padding: 12px 0;
        }
        .finger-swipe {
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%); z-index: 5;
            font-size: 26px; color: var(--accent); opacity: 0.8;
            pointer-events: none; animation: fingerMove 1.8s ease-in-out 2;
            transition: opacity 0.6s ease;
        }
        @keyframes fingerMove {
            0%, 100% { transform: translateX(-50%) translateX(-15px); opacity: 0.4; }
            50% { transform: translateX(-50%) translateX(15px); opacity: 1; }
        }
        .finger-swipe.hidden { opacity: 0 !important; animation: none !important; }

        /* ===== 互動按鈕區 ===== */
        .action-buttons {
            display: flex; gap: 10px; margin: 16px 0 0;
        }
        .action-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 14px 16px; border-radius: 16px;
            background: var(--bg-card); border: 1px solid var(--border-light);
            box-shadow: var(--shadow-item); color: var(--text-primary);
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background: var(--bg-card-hover); transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }
        .action-btn:active { transform: scale(0.97); }
        .action-btn .icon { font-size: 18px; }

        /* ===== 底部固定 CTA ===== */
        .bottom-cta-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; gap: 10px;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(to top, var(--bg-body) 75%, transparent);
            z-index: 998; justify-content: center; pointer-events: none;
        }
        .bottom-cta-bar .cta-btn {
            flex: 1; max-width: 240px;
            display: flex; align-items: center; justify-content: center;
            gap: 6px; padding: 14px 16px; border-radius: 30px;
            font-size: 14px; font-weight: 700; text-decoration: none;
            border: none; cursor: pointer; transition: all 0.2s ease;
            pointer-events: auto; white-space: nowrap;
        }
        .bottom-cta-bar .cta-line {
            background: #06C755; color: #fff;
            box-shadow: 0 6px 20px rgba(6, 199, 85, 0.35);
        }
        .bottom-cta-bar .cta-line:hover { background: #05b04a; transform: translateY(-1px); }
        .bottom-cta-bar .cta-order {
            background: var(--accent); color: #fff;
            box-shadow: 0 6px 20px rgba(176, 152, 136, 0.35);
        }
        .bottom-cta-bar .cta-order:hover {
            background: var(--accent-light); color: var(--text-primary);
            transform: translateY(-1px);
        }

        .global-update-time {
            text-align: right; font-size: 11px;
            color: var(--text-muted); margin: 12px 0 0;
        }
        .footer {
            text-align: center; margin-top: 20px; font-size: 11px;
            color: var(--text-footer); border-top: 1px solid var(--border-light);
            padding-top: 16px;
        }

        /* ===== Modal 通用 ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg); backdrop-filter: blur(8px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            padding: 20px; opacity: 0; pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--bg-card); border-radius: 28px;
            padding: 24px 22px 20px; max-width: 420px; width: 100%;
            max-height: 85vh; display: flex; flex-direction: column;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
            transform: translateY(24px) scale(0.96);
            transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }
        .modal-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 8px;
        }
        .modal-header h3 {
            font-size: 20px; font-weight: 700; color: var(--text-primary);
        }
        .modal-close {
            background: var(--bg-sold); border: none; border-radius: 50%;
            width: 34px; height: 34px; font-size: 16px; color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover { background: var(--border-light); color: var(--text-primary); }
        .modal-sub {
            font-size: 13px; color: var(--text-secondary);
            margin: 4px 0 14px; padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }
        .modal-actions {
            display: flex; gap: 10px; justify-content: flex-end;
            padding-top: 12px; border-top: 1px solid var(--border-light);
            margin-top: 4px;
        }
        .modal-actions button {
            padding: 10px 24px; border-radius: 40px; border: none;
            font-weight: 600; font-size: 14px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .modal-actions button:active { transform: scale(0.96); }
        .modal-actions .btn-cancel { background: var(--bg-sold); color: var(--text-muted); }
        .modal-actions .btn-cancel:hover { background: var(--border-light); }
        .modal-actions .btn-confirm {
            background: var(--accent); color: #fff; min-width: 100px;
        }
        .modal-actions .btn-confirm:hover:not(:disabled) {
            background: var(--accent-light); color: var(--text-primary);
        }
        .modal-actions .btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
        .modal-error {
            color: #d93025; font-size: 13px; min-height: 20px;
            margin: 4px 0; font-weight: 500;
        }

        /* ===== 許願池 ===== */
        .wish-input-wrap { margin: 4px 0 6px; }
        .wish-input-wrap input {
            width: 100%; padding: 12px 16px; border-radius: 40px;
            border: 2px solid var(--border-light); background: var(--bg-card);
            color: var(--text-primary); font-size: 15px; outline: none;
            transition: border 0.2s;
        }
        .wish-input-wrap input:focus { border-color: var(--accent); }
        .wish-hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; padding-left: 6px; }

        /* ===== 首次訪問彈窗 ===== */
        .welcome-box {
            text-align: center; padding: 30px 22px 20px;
        }
        .welcome-icon {
            font-size: 60px; margin-bottom: 10px;
            animation: bounceIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .welcome-box h3 {
            font-size: 21px; color: var(--text-primary);
            margin-bottom: 12px; line-height: 1.45; font-weight: 700;
        }
        .welcome-box p {
            font-size: 14px; color: var(--text-secondary);
            line-height: 1.7; margin-bottom: 20px;
        }
        .welcome-btn {
            display: block; width: 100%; padding: 14px;
            border-radius: 30px; background: #06C755; color: #fff;
            font-size: 16px; font-weight: 700; text-decoration: none;
            border: none; cursor: pointer;
            box-shadow: 0 6px 20px rgba(6, 199, 85, 0.35);
            transition: all 0.2s ease;
        }
        .welcome-btn:hover { background: #05b04a; transform: translateY(-1px); }
        .welcome-skip {
            display: block; width: 100%; margin-top: 8px; padding: 10px;
            border-radius: 30px; background: transparent; border: none;
            color: var(--text-muted); font-size: 13px; cursor: pointer;
            transition: color 0.2s;
        }
        .welcome-skip:hover { color: var(--text-secondary); }
        @keyframes bounceIn {
            0% { transform: scale(0.4); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ===== 隨機推薦 ===== */
        .random-box { text-align: center; padding: 30px 22px 20px; }
        .random-icon {
            font-size: 54px; margin-bottom: 6px;
            animation: diceSpin 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes diceSpin {
            from { transform: rotate(0deg) scale(0.4); opacity: 0; }
            to { transform: rotate(360deg) scale(1); opacity: 1; }
        }
        .random-box h3 {
            font-size: 15px; color: var(--text-secondary);
            font-weight: 500; margin-bottom: 6px;
        }
        .random-result {
            font-size: 30px; font-weight: 800; color: var(--accent);
            margin-bottom: 22px; letter-spacing: 1px;
            min-height: 40px; line-height: 1.2;
        }
        .random-actions { display: flex; gap: 10px; }
        .random-actions button {
            flex: 1; padding: 12px; border-radius: 30px;
            border: none; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
        }
        .random-actions button:active { transform: scale(0.96); }

        const firebaseConfig = {

        const COLOR_MAP = {
            '開心果': '#8CB872', '草莓': '#E8837A', '巧克力': '#8D7A6D', '芒果': '#F5C542',
            '抹茶': '#89B87C', '香草': '#F5E6D3', '咖啡': '#B5957A', '檸檬': '#F5E56B',
            '覆盆子': '#E8707A', '椰奶': '#F5F0EA', '百香果': '#F5B84D', '牛奶': '#FDF8F0',
            'Oreo': '#6B5A4D', '香蕉': '#F5D87A', '藍莓': '#7A8FC9', '水蜜桃': '#F5D0C0',
            '提拉米蘇': '#C4B0A0', '紅茶': '#C4B0A0', '伯爵奶茶': '#E0D5CC', '榴槤': '#F5C542',
            '芋頭牛奶': '#C9A8D0', '綜合堅果': '#C4B0A0', '芒果優格': '#F5C542', '烏龍茶': '#A09080',
            '70%巧克力': '#6B5A4D', '白咖啡': '#D5C8BF', '蜜香紅茶': '#D5C0A8', '黑金芝麻': '#4A3A30',
            '紅豆牛奶': '#D5A0A0', '法芙娜': '#6B5A4D', '波本香草': '#F5E6D3', '迎香紅茶': '#D5C0A8',
            '青心烏龍茶': '#A09080', '藍莓優格': '#7A8FC9', '百香果優格': '#F5B84D', '榴蓮': '#F5C542',
            '奇異果': '#89B87C', '草莓優格': '#E8837A', '火龍果': '#E8707A', '奶茶': '#D5C8BF',
            '熱帶水果': '#F5C542'
        };

        // ---- 工具 ----
        function escapeHtml(s) {
            return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
        }
        function getCurrentTime() {
            const d = new Date();
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }
        function setSyncStatus(status, text) {
            indicatorDot.className = 'indicator ' + status;
            syncText.textContent = text;
            updateTimeDisplay.textContent = '口味同步系統更新於 ' + getCurrentTime();
        }
        function setText(id, v) {
            const el = document.getElementById(id);
            if (el) el.textContent = v;
        }
        let toastTimer = null;
        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
        }

        // ============================================================
        // ★ 營業時間邏輯（1:1 對應你提供的 getShopStatus）
        // ============================================================
        const DEFAULT_HOURS = { open: true, start: '13:00', end: '20:00' };
        const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

        function toMinutes(time) {
            const [h, m] = String(time).split(':').map(Number);
            return h * 60 + m;
        }
        function taipeiParts(date) {
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Taipei', weekday: 'short',
                hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
            }).formatToParts(date);
            const get = (type) => parts.find(p => p.type === type)?.value ?? '0';
            return {
                dayKey: get('weekday').toLowerCase().slice(0, 3),
                minutes: Number(get('hour')) * 60 + Number(get('minute'))
            };
        }
        function dayHours(hours, key) {
            return { ...DEFAULT_HOURS, ...(hours[key] || {}) };
        }

        // 尚未設定營業時間（null）時視為營業，避免設定資料遺失就鎖住
        // shopMode：auto 依每週時間；open 強制營業中；closed 手動打烊（今天不接單、仍可預約明天）；off 店休中（全部暫停）
        function getShopStatus(hours, now = new Date()) {
            if (!hours) return { isOpen: true, canOrder: true, label: '今日營業中', detail: '' };
            const mode = hours.shopMode || (hours.shopClosed ? 'off' : 'auto');
            if (mode === 'off') {
                return { isOpen: false, canOrder: false, label: '店休中', detail: '目前店休中，線上點餐暫停，歡迎先瀏覽口味。' };
            }
            const { dayKey, minutes } = taipeiParts(now);
            const today = dayHours(hours, dayKey);
            const tomorrow = dayHours(hours, taipeiParts(new Date(now.getTime() + 86400000)).dayKey);
            const tomorrowOk = tomorrow.open;

            if (mode === 'closed') {
                if (!tomorrowOk) return { isOpen: false, canOrder: false, label: '已打烊', detail: '今天已打烊，明天不營業，線上點餐暫停。' };
                return { isOpen: false, canOrder: true, label: '已打烊', detail: '今天已打烊，仍可預約明天取餐。' };
            }

            const forcedOpen = mode === 'open';
            const isOpen = forcedOpen || (today.open && minutes >= toMinutes(today.start) && minutes < toMinutes(today.end));
            const todayCanOrder = forcedOpen || (today.open && minutes < toMinutes(today.end));
            const canOrder = todayCanOrder || tomorrowOk;
            if (isOpen) return { isOpen, canOrder, label: '今日營業中', detail: forcedOpen ? '' : `營業時間 ${today.start} – ${today.end}` };

            const label = !today.open ? '今日店休' : minutes < toMinutes(today.start) ? '尚未營業' : '今日已打烊';
            if (!canOrder) return { isOpen, canOrder, label, detail: '今天與明天都不營業，線上點餐暫停，歡迎先瀏覽口味。' };
            return { isOpen, canOrder, label, detail: `目前未營業，仍可預約${todayCanOrder ? '今天' : '明天'}取餐。` };
        }

        let shopHours = null;
        function applyShopStatus() {
            const st = getShopStatus(shopHours);
            const bar = document.getElementById('shopStatusBar');
            bar.classList.toggle('closed', !st.isOpen && !st.canOrder);
            bar.classList.toggle('reservable', !st.isOpen && st.canOrder);
            document.getElementById('shopStatusLabel').textContent = st.label;
            document.getElementById('shopStatusDetail').textContent = st.detail || '';
        }
        onValue(ref(db, 'businessHours'), (snap) => {
            shopHours = snap.val();
            applyShopStatus();
        }, (err) => { console.warn('營業時間讀取失敗:', err); });
        setInterval(applyShopStatus, 30000);

        // ============================================================
        // ★ 今日口味 + 排行 + 新上架
        // ============================================================
        let todayFlavorsData = null;
        let flavorStatsData = {};
        let flavorFirstSeenData = {};

        function renderTodayGrid() {
            if (!todayFlavorsData) {
                todayGrid.innerHTML = '<div class="today-empty">今天還沒有特別推薦 🍽️</div>';
                return;
            }
            const items = Object.keys(todayFlavorsData).map(k => ({ id: k, ...todayFlavorsData[k] }));
            items.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

            const sortedBySales = [...items].sort((a, b) => {
                const sa = Number(flavorStatsData[a.name]?.totalSold || 0);
                const sb = Number(flavorStatsData[b.name]?.totalSold || 0);
                return sb - sa;
            });
            const rankMap = {};
            sortedBySales.forEach((item, index) => {
                const sales = Number(flavorStatsData[item.name]?.totalSold || 0);
                if (sales > 0) rankMap[item.name] = { rank: index + 1, sales };
            });

            const now = Date.now();
            const NEW_DAYS = 14 * 24 * 60 * 60 * 1000;

            let html = '';
            items.forEach(item => {
                const sold = item.soldOut === true;
                const color = COLOR_MAP[item.name] || '#D5C8BF';
                const stat = rankMap[item.name];
                const firstSeen = Number(flavorFirstSeenData[item.name] || 0);
                const isNew = item.isNew === true || (firstSeen > 0 && (now - firstSeen) < NEW_DAYS);

                let badgeHtml = '';
                if (sold) {
                    badgeHtml = '<span class="badge badge-sold">售完</span>';
                } else if (isNew) {
                    badgeHtml = '<span class="badge badge-new">🆕 新上架</span>';
                } else if (stat && stat.rank <= 3) {
                    const medal = stat.rank === 1 ? '🥇' : stat.rank === 2 ? '🥈' : '🥉';
                    badgeHtml = `<span class="badge badge-hot">${medal} TOP ${stat.rank}</span>`;
                } else if (stat && stat.sales >= 5) {
                    badgeHtml = `<span class="badge badge-sales">🔥 ${stat.sales}</span>`;
                }

                html += `
                    <div class="today-card ${sold ? 'sold-out' : ''}" data-flavor="${escapeHtml(item.name)}">
                        ${badgeHtml}
                        <div class="color-tag" style="background:${color};"></div>
                        <div class="today-name">${escapeHtml(item.name)}</div>
                        ${item.desc ? `<div class="today-desc">${escapeHtml(item.desc)}</div>` : ''}
                    </div>`;
            });
            todayGrid.innerHTML = html;
        }

        onValue(ref(db, 'todayFlavors'), (s) => {
            todayFlavorsData = s.val();
            renderTodayGrid();
            setSyncStatus('online', '同步中');
            setTimeout(checkScrollable, 400);
            setTimeout(updateScrollIndicator, 500);

            if (todayFlavorsData) {
                Object.values(todayFlavorsData).forEach(item => {
                    if (!item?.name) return;
                    runTransaction(ref(db, `flavorFirstSeen/${item.name}`), (current) => {
                        return current || Date.now();
                    }).catch(() => {});
                });
            }
        }, () => {
            todayGrid.innerHTML = '<div class="today-empty">連線服務中斷⋯口味無法同步，請至門市直接洽詢</div>';
            setSyncStatus('offline', '離線');
        });

        onValue(ref(db, 'flavorStats'), (s) => {
            flavorStatsData = s.val() || {};
            renderTodayGrid();
        });

        onValue(ref(db, 'flavorFirstSeen'), (s) => {
            flavorFirstSeenData = s.val() || {};
            renderTodayGrid();
        });

        // ---- siteConfig ----
        onValue(ref(db, 'siteConfig'), (s) => {
            const d = s.val();
            if (!d) return;
            setText('brandMainTitle', d.brand?.mainTitle || 'OMG! Gelato');
            const subEl = document.getElementById('todaySectionTitle');
            if (subEl) subEl.textContent = d.brand?.subTitle || '🪧 今日口味查看 & 同步店內冰櫃 🪧';
        });

        // ---- globalOverlay ----
        onValue(ref(db, 'globalOverlay'), (snap) => {
            const data = snap.val();
            const existing = document.getElementById('globalOverlay');
            if (data && data.isActive === true) {
                if (existing) return;
                const div = document.createElement('div');
                div.id = 'globalOverlay';
                div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:99999;padding:24px;';
                div.innerHTML = `
                    <div style="background:#fff;border-radius:32px;padding:40px 32px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
                        <div style="font-size:64px;margin-bottom:8px;">${data.title ? data.title.split(' ')[0] : '📢'}</div>
                        <p style="font-size:18px;font-weight:600;color:#2d1b12;margin-bottom:4px;">${escapeHtml(data.title) || '公告'}</p>
                        <p style="font-size:16px;color:#6b5b4e;line-height:1.8;white-space:pre-line;">${escapeHtml(data.content || '')}</p>
                        <div style="margin-top:20px;padding-top:16px;border-top:1px solid #f0ebe6;font-size:13px;color:#b0a094;">${escapeHtml(data.subText || '')}</div>
                        ${data.isForce ? '' : `<button id="closeOverlayBtn" style="margin-top:16px;background:#f0ebe6;border:none;padding:8px 24px;border-radius:30px;font-weight:600;cursor:pointer;">關閉</button>`}
                    </div>
                `;
                document.body.appendChild(div);
                document.body.style.overflow = 'hidden';
                if (!data.isForce) {
                    document.getElementById('closeOverlayBtn')?.addEventListener('click', () => {
                        div.remove();
                        document.body.style.overflow = '';
                    });
                }
            } else {
                if (existing) {
                    existing.remove();
                    document.body.style.overflow = '';
                }
            }
        });

        // ============================================================
        // 手指滑動提示
        // ============================================================
        function handleFingerSwipe(show) {
            if (!fingerSwipe) return;
            if (show) {
                fingerSwipe.classList.remove('hidden');
                fingerSwipe.style.display = 'block';
                clearTimeout(window.fingerTimer);
                window.fingerTimer = setTimeout(() => {
                    fingerSwipe.classList.add('hidden');
                    setTimeout(() => fingerSwipe.style.display = 'none', 600);
                }, 3800);
            } else {
                fingerSwipe.classList.add('hidden');
                fingerSwipe.style.display = 'none';
            }
        }
        function checkScrollable() {
            if (!todayScroll || !fingerSwipe) return;
            const isScrollable = todayScroll.scrollWidth > todayScroll.clientWidth;
            if (isScrollable) handleFingerSwipe(true);
            else handleFingerSwipe(false);
        }
        todayScroll.addEventListener('scroll', () => {
            if (fingerSwipe && !fingerSwipe.classList.contains('hidden')) {
                fingerSwipe.classList.add('hidden');
                setTimeout(() => fingerSwipe.style.display = 'none', 600);
            }
        });
        function updateScrollIndicator() {
            const el = todayScroll;
            const fill = scrollFill;
            if (!el || !fill) return;
            const update = () => {
                const max = el.scrollWidth - el.clientWidth;
                if (max <= 0) { fill.style.width = '100%'; return; }
                fill.style.width = Math.min((el.scrollLeft / max) * 100 + 20, 100) + '%';
            };
            el.addEventListener('scroll', update);
            window.addEventListener('resize', update);
            setTimeout(update, 200);
        }

        // ============================================================
        // 許願池
        // ============================================================
        const wishModal = document.getElementById('wishModal');
        const wishInput = document.getElementById('wishInput');
        const wishError = document.getElementById('wishError');
        const wishConfirmBtn = document.getElementById('wishConfirmBtn');

        function openWishModal() {
            wishInput.value = '';
            wishError.textContent = '';
            wishConfirmBtn.disabled = false;
            wishConfirmBtn.textContent = '送出願望 ✨';
            wishModal.classList.add('open');
            document.body.style.overflow = 'hidden';
            setTimeout(() => wishInput.focus(), 200);
        }
        function closeWishModal() {
            wishModal.classList.remove('open');
            document.body.style.overflow = '';
        }
        function submitWish() {
            const val = wishInput.value.trim();
            if (!val) { wishError.textContent = '請輸入您想吃的口味名稱'; return; }
            if (val.length < 2) { wishError.textContent = '請輸入至少 2 個字'; return; }

            wishConfirmBtn.disabled = true;
            wishConfirmBtn.textContent = '⏳ 送出中...';
            wishError.textContent = '';

            const wishData = {
                flavor: val,
                timestamp: Date.now(),
                date: new Date().toISOString().split('T')[0],
                status: 'pending',
                source: 'visitor_page'
            };
            set(push(ref(db, 'wishlist')), wishData)
                .then(() => {
                    wishConfirmBtn.textContent = '✅ 已送出';
                    showToast(`已收到你的許願：${val}`);
                    setTimeout(closeWishModal, 900);
                })
                .catch(err => {
                    console.warn('許願送出失敗:', err);
                    const pending = JSON.parse(localStorage.getItem('pendingWishes') || '[]');
                    pending.push(wishData);
                    localStorage.setItem('pendingWishes', JSON.stringify(pending));
                    wishError.textContent = '📡 網路不穩，已先記錄，稍後自動同步';
                    wishConfirmBtn.disabled = false;
                    wishConfirmBtn.textContent = '送出願望 ✨';
                });
        }
        document.getElementById('wishBtn').addEventListener('click', openWishModal);
        document.getElementById('wishModalClose').addEventListener('click', closeWishModal);
        document.getElementById('wishCancelBtn').addEventListener('click', closeWishModal);
        wishModal.addEventListener('click', (e) => { if (e.target === wishModal) closeWishModal(); });
        wishConfirmBtn.addEventListener('click', submitWish);
        wishInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitWish(); });

        function syncPendingWishes() {
            const pending = JSON.parse(localStorage.getItem('pendingWishes') || '[]');
            if (pending.length === 0) return;
            let successCount = 0;
            pending.forEach(item => {
                set(push(ref(db, 'wishlist')), item).then(() => {
                    successCount++;
                    if (successCount === pending.length) {
                        localStorage.removeItem('pendingWishes');
                    }
                }).catch(() => {});
            });
        }
        syncPendingWishes();

        // ============================================================
        // 隨機推薦
        // ============================================================
        function getAvailableFlavors() {
            const cards = document.querySelectorAll('#todayGrid .today-card:not(.sold-out)');
            const flavors = [];
            cards.forEach(c => {
                const name = c.dataset.flavor;
                if (name && !flavors.includes(name)) flavors.push(name);
            });
            return flavors;
        }
        function pickRandom(flavors) {
            const arr = flavors || getAvailableFlavors();
            if (!arr.length) return;
            const el = document.getElementById('randomIcon');
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = '';
            const pick = arr[Math.floor(Math.random() * arr.length)];
            document.getElementById('randomResult').textContent = pick;
        }
        function openRandomModal() {
            const flavors = getAvailableFlavors();
            if (!flavors.length) {
                showToast('目前沒有可選的口味');
                return;
            }
            pickRandom(flavors);
            document.getElementById('randomModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeRandomModal() {
            document.getElementById('randomModal').classList.remove('open');
            document.body.style.overflow = '';
        }
        document.getElementById('randomBtn').addEventListener('click', openRandomModal);
        document.getElementById('randomAgainBtn').addEventListener('click', () => pickRandom());
        document.getElementById('randomCloseBtn').addEventListener('click', closeRandomModal);
        document.getElementById('randomModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('randomModal')) closeRandomModal();
        });

        // ============================================================
        // CTA 按鈕
        // ============================================================
        document.getElementById('addLineBtn').href = LINE_FRIEND_URL;
        document.getElementById('orderBtn').href = ORDER_PAGE_URL;
        document.getElementById('welcomeJoinBtn').href = LINE_FRIEND_URL;

        document.getElementById('addLineBtn').addEventListener('click', () => {
            const guestId = localStorage.getItem('omg-guest-id') || (() => {
                const id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
                localStorage.setItem('omg-guest-id', id);
                return id;
            })();
            set(ref(db, `visitorClicks/addLine/${guestId.replace(/[^A-Za-z0-9_-]/g, '')}`), Date.now()).catch(() => {});
        });

        // ============================================================
        // 首次訪問彈窗
        // ============================================================
        const welcomeModal = document.getElementById('welcomeModal');
        const WELCOME_KEY = 'omg-welcomed-v1';
        if (!localStorage.getItem(WELCOME_KEY)) {
            setTimeout(() => {
                welcomeModal.classList.add('open');
                document.body.style.overflow = 'hidden';
            }, 1200);
        }
        document.getElementById('welcomeSkipBtn').addEventListener('click', () => {
            localStorage.setItem(WELCOME_KEY, 'skipped');
            welcomeModal.classList.remove('open');
            document.body.style.overflow = '';
        });
        document.getElementById('welcomeJoinBtn').addEventListener('click', () => {
            localStorage.setItem(WELCOME_KEY, 'joined');
        });
        welcomeModal.addEventListener('click', (e) => {
            if (e.target === welcomeModal) {
                localStorage.setItem(WELCOME_KEY, 'closed');
                welcomeModal.classList.remove('open');
                document.body.style.overflow = '';
            }
        });

        // ============================================================
        // 初始化
        // ============================================================
        setSyncStatus('connecting', '連線中');
        setTimeout(checkScrollable, 600);
        updateScrollIndicator();

        document.getElementById('brandLogo')?.addEventListener('error', function() {
            this.outerHTML = '<span style="font-size:72px;display:block;text-align:center;">🍨</span>';
        });

        console.log('🍦 訪客口味頁已載入');
    </script>
</body>
</html>
